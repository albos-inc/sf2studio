[package]
name = "sf2studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Make, tune and compare SF2 instruments: an SF2 generator, a tuning player and an A/B comparison tool built on sf2synth."
license = "MIT OR Apache-2.0"
authors = ["Albos Inc."]
repository = "https://github.com/albos-inc/sf2studio"
readme = "README.md"
keywords = ["sf2", "synthesizer", "midi", "audio", "piano"]
categories = ["multimedia::audio"]

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui-phosphor = "0.14"
egui_plot = "0.37"
hound = "3.5.1"
midir = "0.11.0"
realfft = "3.5.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sf2synth = { git = "https://github.com/albos-inc/sf2synth", tag = "v0.4.0" }
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "gzip"] }
png = { version = "0.18.1", optional = true }

[features]
# The guide's screenshots: `cargo run --features capture -- --capture docs/images`.
capture = ["dep:png"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# For `cargo bundle` (macOS .app).
[package.metadata.bundle]
name = "sf2studio"
identifier = "jp.albos.sf2studio"
icon = ["assets/icon-32.png", "assets/icon-128.png", "assets/icon-256.png", "assets/icon-512.png", "assets/icon-1024.png"]
category = "public.app-category.music"
copyright = "© 2026 Albos Inc."

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-avf-audio = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
resvg = "0.48.1"
