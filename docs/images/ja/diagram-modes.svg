<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Segoe UI', 'Noto Sans CJK JP', sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#687082"/></marker><linearGradient id="heat" x1="0" y1="1" x2="0" y2="0"><stop offset="0.00" stop-color="#000004"/><stop offset="0.25" stop-color="#3c0f6e"/><stop offset="0.50" stop-color="#b43264"/><stop offset="0.75" stop-color="#fa8c28"/><stop offset="1.00" stop-color="#fcfabe"/></linearGradient><linearGradient id="heat-x" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#000004"/><stop offset="0.25" stop-color="#3c0f6e"/><stop offset="0.50" stop-color="#b43264"/><stop offset="0.75" stop-color="#fa8c28"/><stop offset="1.00" stop-color="#fcfabe"/></linearGradient><linearGradient id="press" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4084ff" stop-opacity="0.08"/><stop offset="1" stop-color="#4084ff" stop-opacity="0.75"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="899" height="359" rx="16" fill="#ffffff" stroke="#d9dde5"/>
<text x="30.0" y="40.0" font-size="19" font-weight="700" fill="#1f2430" text-anchor="start">3 つのモード</text>
<rect x="30.0" y="64.0" width="260.0" height="190.0" rx="12" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<rect x="30.0" y="64.0" width="6.0" height="190.0" rx="3" fill="#9b6bff" stroke="none" stroke-width="1.5" />
<text x="50.0" y="94.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="start">作成 — SF2 を作る</text>
<circle cx="54" cy="117.5" r="2.5" fill="#687082"/>
<text x="64.0" y="122.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">元にする音: 既存の SF2・</text>
<circle cx="54" cy="140.45" r="2.5" fill="#687082"/>
<text x="64.0" y="144.9" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">録音・内蔵の合成</text>
<circle cx="54" cy="163.39999999999998" r="2.5" fill="#687082"/>
<text x="64.0" y="167.9" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">音色・タッチ・余韻を整える</text>
<circle cx="54" cy="186.34999999999997" r="2.5" fill="#687082"/>
<text x="64.0" y="190.8" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">弾いて確かめ、保存する</text>
<rect x="320.0" y="64.0" width="260.0" height="190.0" rx="12" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<rect x="320.0" y="64.0" width="6.0" height="190.0" rx="3" fill="#4084ff" stroke="none" stroke-width="1.5" />
<text x="340.0" y="94.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="start">調整再生 — 弾いて調整</text>
<circle cx="344" cy="117.5" r="2.5" fill="#687082"/>
<text x="354.0" y="122.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">88 鍵の鍵盤を弾く</text>
<circle cx="344" cy="140.45" r="2.5" fill="#687082"/>
<text x="354.0" y="144.9" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">1 音ずつ全レーンで見る</text>
<circle cx="344" cy="163.39999999999998" r="2.5" fill="#687082"/>
<text x="354.0" y="167.9" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">聞きながら sf2synth を調整</text>
<circle cx="344" cy="186.34999999999997" r="2.5" fill="#687082"/>
<text x="354.0" y="190.8" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">設定を TOML に保存</text>
<rect x="610.0" y="64.0" width="260.0" height="190.0" rx="12" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<rect x="610.0" y="64.0" width="6.0" height="190.0" rx="3" fill="#22a06b" stroke="none" stroke-width="1.5" />
<text x="630.0" y="94.0" font-size="16" font-weight="700" fill="#1f2430" text-anchor="start">比較 — 並べて聞き比べ</text>
<circle cx="634" cy="117.5" r="2.5" fill="#687082"/>
<text x="644.0" y="122.0" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">シンセ・SF2・録音を</text>
<circle cx="634" cy="140.45" r="2.5" fill="#687082"/>
<text x="644.0" y="144.9" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">最大 9 レーン並べる</text>
<circle cx="634" cy="163.39999999999998" r="2.5" fill="#687082"/>
<text x="644.0" y="167.9" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">再生しながら聞く対象を切替</text>
<circle cx="634" cy="186.34999999999997" r="2.5" fill="#687082"/>
<text x="644.0" y="190.8" font-size="13.5" font-weight="400" fill="#1f2430" text-anchor="start">計測グラフとブラインドテスト</text>
<path d="M160,256 C160,320 740,320 740,258" stroke="#687082" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
<text x="450.0" y="335.0" font-size="13" font-weight="400" fill="#687082" text-anchor="middle">「比較に追加」で作った音源がレーンに入る</text>
<line x1="582.0" y1="150.0" x2="606.0" y2="150.0" stroke="#687082" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<line x1="608.0" y1="166.0" x2="584.0" y2="166.0" stroke="#687082" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<text x="595.0" y="192.0" font-size="11" font-weight="400" fill="#687082" text-anchor="middle">同じ</text>
<text x="595.0" y="206.8" font-size="11" font-weight="400" fill="#687082" text-anchor="middle">レーン</text>
</svg>
