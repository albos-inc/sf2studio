<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Segoe UI', 'Noto Sans CJK JP', sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#687082"/></marker><linearGradient id="heat" x1="0" y1="1" x2="0" y2="0"><stop offset="0.00" stop-color="#000004"/><stop offset="0.25" stop-color="#3c0f6e"/><stop offset="0.50" stop-color="#b43264"/><stop offset="0.75" stop-color="#fa8c28"/><stop offset="1.00" stop-color="#fcfabe"/></linearGradient><linearGradient id="heat-x" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#000004"/><stop offset="0.25" stop-color="#3c0f6e"/><stop offset="0.50" stop-color="#b43264"/><stop offset="0.75" stop-color="#fa8c28"/><stop offset="1.00" stop-color="#fcfabe"/></linearGradient><linearGradient id="press" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4084ff" stop-opacity="0.08"/><stop offset="1" stop-color="#4084ff" stop-opacity="0.75"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="899" height="319" rx="16" fill="#ffffff" stroke="#d9dde5"/>
<text x="30.0" y="40.0" font-size="19" font-weight="700" fill="#1f2430" text-anchor="start">音量を揃える: 大きさではなく音そのものを比べる</text>
<text x="80.0" y="80.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">測った音量</text>
<rect x="80.0" y="140.0" width="60.0" height="110.0" rx="6" fill="#5aaaff" stroke="none" stroke-width="1.5" />
<text x="110.0" y="272.0" font-size="15" font-weight="700" fill="#5aaaff" text-anchor="middle">A</text>
<text x="110.0" y="130.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle">-41.7 dB</text>
<rect x="170.0" y="100.0" width="60.0" height="150.0" rx="6" fill="#ffa03c" stroke="none" stroke-width="1.5" />
<text x="200.0" y="272.0" font-size="15" font-weight="700" fill="#ffa03c" text-anchor="middle">B</text>
<text x="200.0" y="90.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle">-36.5 dB</text>
<line x1="290.0" y1="180.0" x2="400.0" y2="180.0" stroke="#687082" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<text x="345.0" y="166.0" font-size="13" font-weight="400" fill="#687082" text-anchor="middle">音量を揃える</text>
<text x="440.0" y="80.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">聞こえる音量</text>
<rect x="440.0" y="140.0" width="60.0" height="110.0" rx="6" fill="#5aaaff" stroke="none" stroke-width="1.5" />
<text x="470.0" y="272.0" font-size="15" font-weight="700" fill="#5aaaff" text-anchor="middle">A</text>
<text x="470.0" y="130.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle">補正 +0.0 dB</text>
<rect x="530.0" y="140.0" width="60.0" height="110.0" rx="6" fill="#ffa03c" stroke="none" stroke-width="1.5" />
<text x="560.0" y="272.0" font-size="15" font-weight="700" fill="#ffa03c" text-anchor="middle">B</text>
<text x="560.0" y="130.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="middle">補正 −5.2 dB</text>
<line x1="430.0" y1="140.0" x2="640.0" y2="140.0" stroke="#e8345c" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="660.0" y="145.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start">すべてのレーンを一番小さい</text>
<text x="660.0" y="161.9" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start">レーンに合わせて下げます。</text>
<text x="660.0" y="178.8" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start">音が割れません。</text>
<text x="660.0" y="210.0" font-size="12.5" font-weight="400" fill="#687082" text-anchor="start">補正量はレーンの欄に表示。</text>
<text x="660.0" y="226.9" font-size="12.5" font-weight="400" fill="#687082" text-anchor="start">オフにすると実際の音量差</text>
<text x="660.0" y="243.8" font-size="12.5" font-weight="400" fill="#687082" text-anchor="start">のまま聞けます。</text>
</svg>
