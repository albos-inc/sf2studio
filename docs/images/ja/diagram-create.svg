<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Segoe UI', 'Noto Sans CJK JP', sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#687082"/></marker><linearGradient id="heat" x1="0" y1="1" x2="0" y2="0"><stop offset="0.00" stop-color="#000004"/><stop offset="0.25" stop-color="#3c0f6e"/><stop offset="0.50" stop-color="#b43264"/><stop offset="0.75" stop-color="#fa8c28"/><stop offset="1.00" stop-color="#fcfabe"/></linearGradient><linearGradient id="heat-x" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#000004"/><stop offset="0.25" stop-color="#3c0f6e"/><stop offset="0.50" stop-color="#b43264"/><stop offset="0.75" stop-color="#fa8c28"/><stop offset="1.00" stop-color="#fcfabe"/></linearGradient><linearGradient id="press" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4084ff" stop-opacity="0.08"/><stop offset="1" stop-color="#4084ff" stop-opacity="0.75"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="899" height="399" rx="16" fill="#ffffff" stroke="#d9dde5"/>
<text x="30.0" y="40.0" font-size="19" font-weight="700" fill="#1f2430" text-anchor="start">音源ができるまで</text>
<text x="30.0" y="74.0" font-size="13" font-weight="700" fill="#687082" text-anchor="start">元にする音</text>
<text x="300.0" y="74.0" font-size="13" font-weight="700" fill="#687082" text-anchor="start">整える</text>
<text x="640.0" y="74.0" font-size="13" font-weight="700" fill="#687082" text-anchor="start">使う</text>
<rect x="30.0" y="88.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="46.0" y="116.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">既存の SF2 / DLS</text>
<text x="46.0" y="138.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">プリセットのサンプルを使う</text>
<line x1="262.0" y1="127.0" x2="296.0" y2="200.0" stroke="#687082" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="30.0" y="180.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="46.0" y="208.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">録音</text>
<text x="46.0" y="230.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">1 音につき 1 つの WAV</text>
<line x1="262.0" y1="219.0" x2="296.0" y2="200.0" stroke="#687082" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="30.0" y="272.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="46.0" y="300.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">合成</text>
<text x="46.0" y="322.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">ピアノ風の音を一から</text>
<line x1="262.0" y1="311.0" x2="296.0" y2="200.0" stroke="#687082" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="300.0" y="88.0" width="300.0" height="126.0" rx="10" fill="#fff" stroke="#4084ff" stroke-width="2" />
<text x="316.0" y="114.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">サンプルに焼き込む</text>
<text x="316.0" y="138.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">音量</text>
<text x="316.0" y="154.2" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">明るさ（2.5 kHz 以上を増減）</text>
<text x="316.0" y="170.4" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">温かみ（200 Hz 以下を増減）</text>
<text x="316.0" y="186.6" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">強さのレイヤー（暗くしたコピー）</text>
<rect x="300.0" y="228.0" width="300.0" height="126.0" rx="10" fill="#fff" stroke="#22a06b" stroke-width="2" />
<text x="316.0" y="254.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">SF2 のパラメータとして書く</text>
<text x="316.0" y="278.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">タッチ: 強弱の差・カーブ・弱音をこもらせる</text>
<text x="316.0" y="294.2" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">余韻: 立ち上がり・減衰・離したあと</text>
<text x="316.0" y="310.4" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">ストレッチ調律・ステレオの広がり・リバーブ</text>
<line x1="604.0" y1="200.0" x2="636.0" y2="200.0" stroke="#687082" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="640.0" y="88.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="656.0" y="116.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">弾く</text>
<text x="656.0" y="138.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">下の鍵盤で試し弾き</text>
<rect x="640.0" y="180.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="656.0" y="208.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">SF2 を保存…</text>
<text x="656.0" y="230.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">どの SF2 プレイヤーでも使える</text>
<rect x="640.0" y="272.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="656.0" y="300.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">比較に追加</text>
<text x="656.0" y="322.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">比較モードのレーンに入る</text>
<text x="30.0" y="382.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">変更するたびに 0.4 秒待って作り直します。パラメータはどの SF2 プレイヤーでも効き、焼き込みは音そのものに残ります。</text>
</svg>
