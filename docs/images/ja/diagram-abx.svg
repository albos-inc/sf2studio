<text x="85.0" y="173.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">🔊 B</text>
<rect x="200.0" y="105.0" width="90.0" height="52.0" rx="10" fill="#5b6270" stroke="none" stroke-width="1.5" />
<text x="245.0" y="138.0" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">🔊 X</text>
<path d="M132,96 C165,96 165,122 196,124" stroke="#687082" stroke-width="1.5" fill="none" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M132,166 C165,166 165,140 196,138" stroke="#687082" stroke-width="1.5" fill="none" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" />
<text x="245.0" y="180.0" font-size="12" font-weight="400" fill="#687082" text-anchor="middle">A か B（どちらかは秘密）</text>
<line x1="300.0" y1="131.0" x2="360.0" y2="131.0" stroke="#687082" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="370.0" y="96.0" width="170.0" height="70.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="455.0" y="124.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="middle">「X は A」/「X は B」</text>
<text x="455.0" y="148.0" font-size="12" font-weight="400" fill="#687082" text-anchor="middle">答えるたびに X を選び直す</text>
<line x1="550.0" y1="131.0" x2="600.0" y2="131.0" stroke="#687082" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="610.0" y="80.0" width="260.0" height="104.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="626.0" y="108.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">正解 9 / 10</text>
<text x="626.0" y="132.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start">当てずっぽうでこうなる確率 1.1%</text>
<text x="626.0" y="156.0" font-size="12.5" font-weight="700" fill="#1e8e4e" text-anchor="start">聞き分けられています。</text>
<path d="M740,186 C740,240 455,240 455,170" stroke="#687082" stroke-width="1.5" fill="none" stroke-dasharray="5 5" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" />
<text x="600.0" y="250.0" font-size="12" font-weight="400" fill="#687082" text-anchor="middle">聞き直して、また答える</text>
<text x="40.0" y="280.0" font-size="12.5" font-weight="400" fill="#1f2430" text-anchor="start">8 回以上答え、確率が 5% 未満なら、たまたまではなく本当に違いが聞こえています。</text>
