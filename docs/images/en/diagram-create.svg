<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Segoe UI', 'Noto Sans CJK JP', sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#687082"/></marker><linearGradient id="heat" x1="0" y1="1" x2="0" y2="0"><stop offset="0.00" stop-color="#000004"/><stop offset="0.25" stop-color="#3c0f6e"/><stop offset="0.50" stop-color="#b43264"/><stop offset="0.75" stop-color="#fa8c28"/><stop offset="1.00" stop-color="#fcfabe"/></linearGradient><linearGradient id="heat-x" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#000004"/><stop offset="0.25" stop-color="#3c0f6e"/><stop offset="0.50" stop-color="#b43264"/><stop offset="0.75" stop-color="#fa8c28"/><stop offset="1.00" stop-color="#fcfabe"/></linearGradient><linearGradient id="press" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4084ff" stop-opacity="0.08"/><stop offset="1" stop-color="#4084ff" stop-opacity="0.75"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="899" height="399" rx="16" fill="#ffffff" stroke="#d9dde5"/>
<text x="30.0" y="40.0" font-size="19" font-weight="700" fill="#1f2430" text-anchor="start">How an instrument is made</text>
<text x="30.0" y="74.0" font-size="13" font-weight="700" fill="#687082" text-anchor="start">Start from</text>
<text x="300.0" y="74.0" font-size="13" font-weight="700" fill="#687082" text-anchor="start">Shape</text>
<text x="640.0" y="74.0" font-size="13" font-weight="700" fill="#687082" text-anchor="start">Use</text>
<rect x="30.0" y="88.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="46.0" y="116.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">An SF2 / DLS</text>
<text x="46.0" y="138.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">a preset&#x27;s samples, kept</text>
<line x1="262.0" y1="127.0" x2="296.0" y2="200.0" stroke="#687082" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="30.0" y="180.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="46.0" y="208.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">Recordings</text>
<text x="46.0" y="230.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">one WAV per note</text>
<line x1="262.0" y1="219.0" x2="296.0" y2="200.0" stroke="#687082" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="30.0" y="272.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="46.0" y="300.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">Synthesis</text>
<text x="46.0" y="322.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">a piano-like tone</text>
<line x1="262.0" y1="311.0" x2="296.0" y2="200.0" stroke="#687082" stroke-width="1.5" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="300.0" y="88.0" width="300.0" height="126.0" rx="10" fill="#fff" stroke="#4084ff" stroke-width="2" />
<text x="316.0" y="114.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">Baked into the samples</text>
<text x="316.0" y="138.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">Volume</text>
<text x="316.0" y="154.2" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">Brightness (shelf at 2.5 kHz)</text>
<text x="316.0" y="170.4" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">Warmth (shelf at 200 Hz)</text>
<text x="316.0" y="186.6" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">Velocity layers (darker copies)</text>
<rect x="300.0" y="228.0" width="300.0" height="126.0" rx="10" fill="#fff" stroke="#22a06b" stroke-width="2" />
<text x="316.0" y="254.0" font-size="14" font-weight="700" fill="#1f2430" text-anchor="start">Written as SF2 parameters</text>
<text x="316.0" y="278.0" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">Touch: range, curve, soft notes darker</text>
<text x="316.0" y="294.2" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">Sustain: attack, fade, release</text>
<text x="316.0" y="310.4" font-size="12" font-weight="400" fill="#1f2430" text-anchor="start">Stretch tuning, stereo width, reverb</text>
<line x1="604.0" y1="200.0" x2="636.0" y2="200.0" stroke="#687082" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="640.0" y="88.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="656.0" y="116.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">Play it</text>
<text x="656.0" y="138.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">on the keyboard below</text>
<rect x="640.0" y="180.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="656.0" y="208.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">Save SF2…</text>
<text x="656.0" y="230.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">a file for any SF2 player</text>
<rect x="640.0" y="272.0" width="230.0" height="78.0" rx="10" fill="#f4f6f9" stroke="#d9dde5" stroke-width="1.5" />
<text x="656.0" y="300.0" font-size="14.5" font-weight="700" fill="#1f2430" text-anchor="start">Compare with others</text>
<text x="656.0" y="322.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">a lane in Compare</text>
<text x="30.0" y="382.0" font-size="12" font-weight="400" fill="#687082" text-anchor="start">It is made again 0.4 s after each change. Parameters work in every SF2 player; baked changes are in the sound itself.</text>
</svg>
